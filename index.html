<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eae8e2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Remote Keyboard</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header><div class="logomark">⌨</div><div><h1>Remote Keyboard</h1><p>iPhone → Windows</p></div><span id="badge" class="badge">接続確認中</span></header>
    <section class="panel" id="pairPanel" hidden>
      <p class="overline">PAIRING</p>
      <h2>PCと接続する</h2>
      <p class="hint">PC側の黒い画面に表示された6桁のコードを入力します。</p>
      <form id="pairForm">
        <label for="pin">接続コード</label>
        <input id="pin" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required>
        <button class="primary" type="submit">接続</button>
      </form>
    </section>
    <section class="panel" id="keyboardPanel" hidden>
      <div class="line"><div><p class="overline">INPUT</p><h2>文字を入力</h2></div><button id="toggle" type="button" class="primary compact">入力を開始</button></div>
      <div class="editorwrap"><textarea id="editor" placeholder="タップしてiPhoneのキーボードで入力" maxlength="750" rows="6" autocomplete="off" autocapitalize="sentences" spellcheck="true"></textarea></div>
      <p class="hint">日本語は変換確定後に送信。文字入力先はWindowsで選択中のアプリです。</p>
      <div class="keys"><button type="button" data-key="Enter">Enter ↵</button><button type="button" data-key="Backspace">削除 ⌫</button><button type="button" data-key="Tab">Tab ↹</button><button type="button" data-key="Escape">Esc</button></div>
      <div class="bottom"><button type="button" id="clear" class="subtle">入力欄だけクリア</button><span id="count">0 / 750</span></div>
    </section>
    <div role="status" aria-live="polite" class="message" id="message">接続状態を確認しています…</div>
    <div id="retryWrap" class="retry" hidden><button type="button" id="retry" class="primary">同じ操作を安全に再送</button></div>
    <p class="foot">Tailscale 内だけで接続 ・ 入力内容はサーバーに保存しません</p>
  </main>
</body>
</html>
