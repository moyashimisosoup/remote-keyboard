name: Verify Remote Keyboard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m py_compile remote_keys.py
      - name: Run protocol tests
        run: python3 -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: node --check app.js
      - name: Check essential files
        run: test -s index.html && test -s style.css && test -s start-windows.cmd
